function render(){ const T=L[lang]; document.documentElement.lang=lang; document.title=T.h; $("h").textContent=T.h; $("s").textContent=T.s; $("h1").textContent=T.h1; $("h2").textContent=T.h2; $("h3").textContent=T.h3; $("foot").innerHTML=T.foot;
